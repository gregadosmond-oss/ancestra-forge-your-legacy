    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AncestorsQR",
        "url": "https://ancestorsqr.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ancestorsqr.com/f/{surname}",
          "query-input": "required name=surname"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AncestorsQR",
        "url": "https://ancestorsqr.com/",
        "logo": "https://ancestorsqr.com/ancestra-crest-3d.png",
        "description": "AI family tree builder and legacy platform — turn your surname into a coat of arms, AI family biography, digital family archive, and QR-coded heirlooms that preserve family history.",
        "slogan": "Every family has a story worth telling."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Where did my family come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Enter your surname at AncestorsQR and our AI traces its origin, the region it emerged from, the role your ancestors likely held, and the historical era they lived through — drawing on centuries of naming, migration, and occupational records."
            }
          },
          {
            "@type": "Question",
            "name": "Why was my last name changed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Surnames were commonly altered at immigration checkpoints, anglicized for new countries, shortened for trade, or changed to escape persecution. AncestorsQR's AI ancestry stories surface the most likely reason your specific name shifted across generations."
            }
          },
          {
            "@type": "Question",
            "name": "Who were my ancestors before immigration?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "AncestorsQR builds an AI family biography from your surname — the region of origin, the trades your bloodline practiced, and a plausible ancestor profile from the era before your family crossed an ocean."
            }
          },
          {
            "@type": "Question",
            "name": "What secrets are hidden in my family tree?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most families carry forgotten name changes, lost trades, migration stories, and ancestors whose names were never written down. AncestorsQR's AI family tree builder surfaces what oral tradition lost and turns it into a digital family archive you can pass on."
            }
          },
          {
            "@type": "Question",
            "name": "Can QR codes preserve family history?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. AncestorsQR prints a genealogy QR code on every heirloom — mugs, canvas prints, blankets, coasters — that links to your family's permanent ancestry memory page. Future generations scan it and instantly see your crest, story, and bloodline."
            }
          }
        ]
      }
    </script>
